name: Schedule GitHub Pages
on:
  push:
    branches: [main]
    paths: ['school-schedule/**', '.github/workflows/schedule-pages.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schedule-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply client fixes
        run: |
          if git apply --check school-schedule/client-fixes.patch; then
            git apply school-schedule/client-fixes.patch
          elif git apply --reverse --check school-schedule/client-fixes.patch; then
            echo "Client fixes already applied."
          else
            echo "Client patch no longer matches index.html." >&2
            exit 1
          fi
      - name: Install spreadsheet reader
        run: python -m pip install "openpyxl>=3.1,<4"
      - name: Restore public icons and fonts
        working-directory: school-schedule
        run: python materialize_assets.py
      - name: Refresh schedule from Google Sheets
        working-directory: school-schedule
        run: python refresh_snapshot.py --sheet
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- school-schedule/; then
            echo "No changes in schedule."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add school-schedule/sheet-data.json \
                    school-schedule/offline-data.js \
                    school-schedule/index.html \
                    school-schedule/pa-dist/offline-data.js \
                    school-schedule/pa-dist/index.html \
                    school-schedule/hf-dist/offline-data.js \
                    school-schedule/hf-dist/index.html
            git commit -m "Auto-refresh schedule: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - name: Save generated public assets
        run: |
          git add -- icon-192.png icon-512.png apple-touch-icon.png assets/ school-schedule/icon-192.png school-schedule/icon-512.png school-schedule/apple-touch-icon.png school-schedule/pa-dist/icon-192.png school-schedule/pa-dist/icon-512.png school-schedule/pa-dist/apple-touch-icon.png school-schedule/hf-dist/icon-192.png school-schedule/hf-dist/icon-512.png school-schedule/hf-dist/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update schedule app icons and offline fonts [skip ci]"
            git push
          fi
      - run: python -m unittest discover -s school-schedule/tests
      - run: node school-schedule/check_js.cjs
      - run: node school-schedule/check_fixes.cjs
      - name: Require configured production API
        run: node school-schedule/check_api.cjs
      - run: python school-schedule/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: school-schedule/pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
