name: Schedule GitHub Pages
on:
  push:
    branches: [main]
    paths: ['school-schedule/**', '.github/workflows/schedule-pages.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schedule-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh schedule from Google Sheets (schedule trigger only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: school-schedule
        run: python refresh_snapshot.py --sheet
      - name: Commit refreshed snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- school-schedule/; then
            echo "No changes in schedule."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add school-schedule/offline-data.js \
                    school-schedule/index.html \
                    school-schedule/pa-dist/offline-data.js \
                    school-schedule/pa-dist/index.html \
                    school-schedule/hf-dist/offline-data.js \
                    school-schedule/hf-dist/index.html
            git commit -m "Auto-refresh schedule: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - run: python -m unittest discover -s school-schedule/tests
      - run: node school-schedule/check_js.cjs
      - name: Require configured production API
        run: node school-schedule/check_api.cjs
      - run: python school-schedule/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: school-schedule/pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
