name: Refresh schedule snapshot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Google Sheet and update snapshot
        working-directory: school-schedule
        run: python refresh_snapshot.py --sheet
      - name: Check for changes
        id: changes
        working-directory: school-schedule
        run: |
          if git diff --quiet -- .; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add school-schedule/offline-data.js \
                  school-schedule/index.html \
                  school-schedule/pa-dist/offline-data.js \
                  school-schedule/pa-dist/index.html \
                  school-schedule/hf-dist/offline-data.js \
                  school-schedule/hf-dist/index.html
          git commit -m "Auto-refresh schedule: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
